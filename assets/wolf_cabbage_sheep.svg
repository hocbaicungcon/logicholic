<!-- credit: giasu.ai.vn -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1080" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8f9fa; }
      .label { font-family: system-ui, sans-serif; font-size: 14px; font-weight: bold; fill: #7f8c8d; text-anchor: middle; }
      .grid-line { stroke: #e0e0e0; stroke-dasharray: 4; stroke-width: 1; }
    </style>
  </defs>

  <!-- Nền sprite sheet -->
  <rect width="1000" height="1080" class="bg"/>

  <!-- ================= 1. NGƯỜI LÁI THUYỀN (FARMER) ================= -->
  <g id="element-farmer" transform="translate(50, 40)">
    <rect x="-10" y="-10" width="140" height="190" fill="none"/>
    <!-- Chân -->
    <rect x="42" y="120" width="14" height="40" rx="4" fill="#7f8c8d"/>
    <rect x="64" y="120" width="14" height="40" rx="4" fill="#7f8c8d"/>
    <!-- Thân / Áo -->
    <path d="M 35,60 L 85,60 L 95,120 L 25,120 Z" fill="#e67e22"/>
    <!-- Đai lưng -->
    <rect x="25" y="95" width="70" height="10" fill="#d35400"/>
    <!-- Tay -->
    <rect x="18" y="60" width="15" height="45" rx="7" fill="#e67e22" transform="rotate(15 18 60)"/>
    <rect x="87" y="60" width="15" height="45" rx="7" fill="#e67e22" transform="rotate(-15 87 60)"/>
    <!-- Đầu & Mặt -->
    <circle cx="60" cy="35" r="22" fill="#ffcc99"/>
    <!-- Tóc -->
    <path d="M 38,30 C 38,10 82,10 82,30 C 75,18 45,18 38,30 Z" fill="#6e2c00"/>
    <!-- Mắt & Miệng -->
    <circle cx="52" cy="35" r="2.5" fill="#2c3e50"/>
    <circle cx="68" cy="35" r="2.5" fill="#2c3e50"/>
    <path d="M 55,45 Q 60,50 65,45" stroke="#2c3e50" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Nón lá/Mũ -->
    <polygon points="60,2 20,25 100,25" fill="#f1c40f"/>
    <text x="60" y="175" class="label">#farmer</text>
  </g>

  <!-- ================= 2. CON SÓI (WOLF) ================= -->
  <g id="element-wolf" transform="translate(230, 40)">
    <!-- Đuôi -->
    <path d="M 25,100 Q -10,80 0,130 Q 20,130 30,110 Z" fill="#4f5b66"/>
    <!-- Thân -->
    <path d="M 30,70 Q 70,40 110,70 Q 130,110 110,140 L 30,140 Z" fill="#6c7a89"/>
    <!-- Đầu -->
    <polygon points="80,60 150,75 100,115" fill="#6c7a89"/>
    <polygon points="120,68 150,75 130,90" fill="#4f5b66"/>
    <circle cx="148" cy="75" r="3.5" fill="#2c3e50"/>
    <polygon points="85,63 80,25 100,55" fill="#4f5b66"/>
    <circle cx="105" cy="75" r="3.5" fill="#f1c40f"/>
    <circle cx="106" cy="75" r="1.8" fill="#000"/>
    <!-- Chân -->
    <rect x="40" y="130" width="14" height="40" rx="5" fill="#4f5b66"/>
    <rect x="90" y="130" width="14" height="40" rx="5" fill="#4f5b66"/>
    <text x="75" y="185" class="label">#wolf</text>
  </g>

  <!-- ================= 3. CON CỪU (SHEEP) ================= -->
  <g id="element-sheep" transform="translate(430, 40)">
    <!-- Chân -->
    <rect x="45" y="110" width="12" height="45" rx="4" fill="#7f8c8d"/>
    <rect x="103" y="110" width="12" height="45" rx="4" fill="#7f8c8d"/>
    <!-- Thân (Lông) -->
