    <circle cx="90" cy="50" r="30" fill="#ecf0f1"/>
    <circle cx="110" cy="80" r="30" fill="#ecf0f1"/>
    <circle cx="80" cy="90" r="30" fill="#ecf0f1"/>
    <circle cx="50" cy="90" r="22" fill="#ecf0f1"/>
    <!-- Đầu -->
    <ellipse cx="140" cy="55" rx="22" ry="16" fill="#95a5a6"/>
    <ellipse cx="130" cy="45" rx="10" ry="5" fill="#7f8c8d" transform="rotate(-30 130 45)"/>
    <circle cx="148" cy="50" r="3" fill="#2c3e50"/>
    <text x="80" y="175" class="label">#sheep</text>
  </g>

  <!-- ================= 4. BẮP CẢI (CABBAGE) ================= -->
  <g id="element-cabbage" transform="translate(630, 50)">
    <circle cx="60" cy="70" r="45" fill="#27ae60"/>
    <path d="M 20,60 Q 60,10 100,60 Q 60,110 20,60 Z" fill="#2ecc71"/>
    <circle cx="60" cy="65" r="25" fill="#a3e4d7"/>
