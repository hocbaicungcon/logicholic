    <path d="M 10,10 Q 30,80 120,80 L 230,80 Q 320,80 340,10 Z" fill="#8d6e63"/>
    <path d="M 0,0 Q 30,95 120,95 L 230,95 Q 320,95 350,0 Q 280,70 175,70 Q 70,70 0,0 Z" fill="#5d4037"/>
    <rect x="70" y="25" width="10" height="40" fill="#4e342e" transform="rotate(15)"/>
    <rect x="250" y="10" width="10" height="40" fill="#4e342e" transform="rotate(-15)"/>
    <text x="175" y="125" class="label">#boat</text>
  </g>

  <g id="element-oar" transform="translate(440, 270)">
    <!-- Mái chèo -->
    <rect x="0" y="8" width="140" height="6" rx="3" fill="#b17a47"/>
    <path d="M 130,0 C 150,0 160,5 160,11 C 160,17 150,22 130,22 Z" fill="#8d5b28"/>
    <text x="80" y="55" class="label">#oar</text>
