<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"><defs>
    
    <pattern id="brick" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#83715d" />
      <path d="M 0,4 L 16,4 M 0,8 L 16,8 M 0,12 L 16,12 M 8,0 L 8,4 M 0,4 L 0,8 M 12,4 L 12,8 M 4,8 L 4,12 M 16,8 L 16,12 M 8,12 L 8,16" stroke="#9a856b" stroke-width="1" />
      <path d="M 0,0 L 16,0 M 0,4 L 8,4 M 0,8 L 4,8 M 12,8 L 16,8 M 0,12 L 8,12" stroke="#5a4d3e" stroke-width="1" />
    </pattern>

    
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d7ab72" />
      <stop offset="50%" stop-color="#b98a5a" />
      <stop offset="100%" stop-color="#916744" />
    </linearGradient>

    <linearGradient id="woodGradStored" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b7c392" />
      <stop offset="50%" stop-color="#8ca77d" />
      <stop offset="100%" stop-color="#647f62" />
    </linearGradient>

    
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ba7e59" />
      <stop offset="100%" stop-color="#9f654b" />
    </linearGradient>

    
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#90a994" />
      <stop offset="100%" stop-color="#667f70" />
    </linearGradient>
  </defs>

  
  
  
  <g id="tile-wall" transform="translate(0, 0)">
    <rect width="64" height="64" fill="url(#brick)" />
  </g>

  
  </svg>